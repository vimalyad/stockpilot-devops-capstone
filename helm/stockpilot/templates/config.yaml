apiVersion: v1
kind: ServiceAccount
metadata:
  name: stockpilot
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stockpilot-config
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
data:
  REDIS_URL: redis://redis:6379/0
  APP_VERSION: {{ .Values.backend.image.tag | quote }}
  POSTGRES_USER: stockpilot
  POSTGRES_DB: stockpilot
