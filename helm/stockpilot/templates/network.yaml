{{- range $component := list "backend" "frontend" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $component }}
  labels:
    {{- include "stockpilot.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: stockpilot, app.kubernetes.io/component: {{ $component }}}
  ports:
    - {name: http, port: {{ if eq $component "backend" }}8000{{ else }}8080{{ end }}, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ $component }}}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: stockpilot, app.kubernetes.io/component: {{ $component }}}
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ $component }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $component }}}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: stockpilot}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range $path := list "/api" "/docs" "/openapi.json" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service: {name: backend, port: {number: 8000}}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 8080}}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: database-ingress}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: stockpilot, app.kubernetes.io/component: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: stockpilot}
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [backend, worker, scheduler, migrate]}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: redis-ingress}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: stockpilot, app.kubernetes.io/component: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: stockpilot}
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [backend, worker, scheduler]}
      ports: [{protocol: TCP, port: 6379}]
{{- end }}
