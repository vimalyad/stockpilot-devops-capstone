# Source: stockpilot/templates/monitoring.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stockpilot-alerts
  labels: {release: monitoring}
spec:
  groups:
    - name: stockpilot
      rules:
        - alert: StockPilotApiUnavailable
          expr: sum(up{namespace="stockpilot",service="backend"}) == 0 or absent(up{namespace="stockpilot",service="backend"})
          for: 2m
          labels: {severity: critical}
          annotations: {summary: "All StockPilot API scrape targets are down"}
        - alert: StockPilotElevatedErrors
          expr: sum(rate(stockpilot_http_requests_total{namespace="stockpilot",status=~"5.."}[5m])) / clamp_min(sum(rate(stockpilot_http_requests_total{namespace="stockpilot"}[5m])), 0.01) > 0.05
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "StockPilot server errors exceed 5 percent"}
        - alert: StockPilotHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(stockpilot_http_request_duration_seconds_bucket{namespace="stockpilot"}[5m]))) > 1
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "StockPilot p95 API latency exceeds one second"}
        - alert: StockPilotWorkerUnavailable
          expr: kube_deployment_status_replicas_available{namespace="stockpilot",deployment="worker"} < 1
          for: 3m
          labels: {severity: warning}
          annotations: {summary: "StockPilot has no available background workers"}
