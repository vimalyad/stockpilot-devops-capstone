kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: stockpilot
    app.kubernetes.io/instance: stockpilot
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: stockpilot-1.0.0
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: stockpilot, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stockpilot, app.kubernetes.io/component: backend}
      annotations:
        checksum/config: c4450cb96ba5b692ac050dde907b5c090e7d46a3be500839fd489eb91eab1dae
    spec:
      serviceAccountName: stockpilot
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-schema
          image: "ghcr.io/vimalyad/stockpilot-devops-capstone-backend:development"
          imagePullPolicy: IfNotPresent
          command: [python, -c]
          args:
            - |
              import time
              from alembic.config import Config
              from alembic.runtime.migration import MigrationContext
              from alembic.script import ScriptDirectory
              from app.database import engine
              expected_heads = set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())
              for attempt in range(120):
                  try:
                      with engine.connect() as connection:
                          current_heads = set(MigrationContext.configure(connection).get_current_heads())
                          if current_heads != expected_heads:
                              raise RuntimeError("Database schema does not match this application release")
                      break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit("Database migrations did not become ready")
          envFrom:
            - configMapRef:
                name: stockpilot-config
            - secretRef:
                name: stockpilot-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      containers:
        - name: backend
          image: "ghcr.io/vimalyad/stockpilot-devops-capstone-backend:development"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: stockpilot-config
            - secretRef:
                name: stockpilot-secrets
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
