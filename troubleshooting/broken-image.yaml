# Deliberately broken; apply only to a disposable lab.
apiVersion: apps/v1
kind: Deployment
metadata: {name: broken-image, namespace: stockpilot}
spec:
  replicas: 1
  selector:
    matchLabels: {app: broken-image}
  template:
    metadata:
      labels: {app: broken-image}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/vimalyad/stockpilot-devops-capstone-backend:deliberately-missing
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
